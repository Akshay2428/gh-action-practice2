name: Checkout Proof

on: [push, workflow_dispatch]

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Show folder before checkout
        run: |
          echo "Current path is:"
          pwd
          echo "Contents before checkout:"
          ls -la

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show folder after checkout
        run: |
          echo "Contents after checkout:"
          ls -la

      - name: Count files after checkout
        run: |
          echo "Number of items now present:"
          ls -l | wc -l

      - name: Finish
        run: echo "Proof captured"