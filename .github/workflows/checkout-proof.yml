name: Checkout Proof

on: 
  push:
  workflow_dispatch:  # This allows the manual trigger

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Look around BEFORE checkout
        run: |
          pwd
          ls -la
          echo "Notice how the folder is almost completely empty!"

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Look around AFTER checkout
        run: |
          pwd
          ls -la
          echo "Now your repository files are actually here."

      - name: Count how many files are present
        run: |
          echo "Total files present:"
          find . -type f | wc -l

      - name: Finish
        run: echo "Proof captured"