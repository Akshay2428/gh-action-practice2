name: Nightly Housekeeper

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Print date and time
        run: date

      - name: Print a message
        run: echo "Running nightly cleanup"

      - name: Finish
        run: echo "Housekeeping complete"