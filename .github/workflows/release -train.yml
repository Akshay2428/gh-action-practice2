name: release-train

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVICE_NAME: order-service

defaults:
  run:
    working-directory: app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm test
        
      - name: print environment info
        run: |
          node --version
          npm --version
          which node
  
  package:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      release_ref: ${{ steps.release_ref.outputs.REF }}
    steps:
      - name: checkout the repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: build release refrence
        id: release_ref
        run: |
          REF="${{env.SERVICE_NAME}}-${{github.run_number}}-$(echo ${{github.sha}} | cut -c1-7)"
          echo "REF=$REF" >> $GITHUB_OUTPUT
          echo "Release reference is $REF"

      - name: create release folder and details files
        run: |
          mkdir -p release
          echo "deployment target: ${{vars.DEPLOY_TARGET}}" > release/${{steps.release_ref.outputs.REF}}
          echo "REF: ${{github.sha}}" >> release/${{steps.release_ref.outputs.REF}}
          echo "EVENT: ${{github.event_name}}" >> release/${{steps.release_ref.outputs.REF}}
          echo "ACTOR:${{github.actor}}" >> release/${{steps.release_ref.outputs.REF}}
          echo "BUILD TIME: $(date -u)" >> release/${{steps.release_ref.outputs.REF}}

      - name: copy a file from app folder
        run:  cp index.js release/

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: write manifest.json
        run: |
          jq -n \
            --arg target "${{ vars.DEPLOY_TARGET }}" \
            --arg ref "${{ github.sha }}" \
            --arg event "${{ github.event_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg buildtime "$(date -u)" \
            '{deployment_target: $target, ref: $ref, event: $event, actor: $actor, build_time_utc: $buildtime}' \
            > release/manifest.json

      - name: Read one value from manifest.json with jq
        run: jq '.deployment_target' release/manifest.json

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Show release folder structure
        run: tree -L 2 release

  announce:
    needs: package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Print release details
        run: |
          echo "Release reference: ${{ needs.package.outputs.release_ref }}"
          echo "Deployment target: ${{ vars.DEPLOY_TARGET }}"
          echo "Service name: ${{ env.SERVICE_NAME }}"

      - name: Announce candidate (PR run)
        if: github.event_name == 'pull_request'
        run: echo "Candidate release ${{ needs.package.outputs.release_ref }} is ready for review"

      - name: Announce release (push to main)
        if: github.event_name == 'push'
        run: echo "Release ${{ needs.package.outputs.release_ref }} has shipped to ${{ vars.DEPLOY_TARGET }}"

      - name: Finish
        run: echo "Release train complete"
  
          
        
   
    