name: release watcher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  release-watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Prints the event name that triggered the run
        run: echo "triggered by ${{github.event_name}}"

      - name: Prints the current date and time
        run: date

      - name: Finishes 
        run: echo "Release watch complete"